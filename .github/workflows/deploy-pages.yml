name: Deploy to GitHub Pages (kikisun.site)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Optimize images, WebP URLs, CMS stubs, and SPA fallback
        run: |
          node compress-images.mjs
          node rewrite-webp-urls.mjs
          node prune-deploy-pngs.mjs
          node ensure-cms-stubs.mjs
          cp site/index.html site/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload site folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
